[workspace]
resolver = "2"
members = ["crates/ndo4git-core", "crates/ndo4git"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NDO4ME/NDO4Git"
authors = ["NDO4ME"]

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
nix = { version = "0.29", default-features = false, features = ["fs", "user", "process", "signal", "hostname", "term"] }
proptest = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "rand_core", "getrandom", "std", "alloc"] }
tempfile = "3"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
zeroize = { version = "1", features = ["serde"] }
ndo4git-core = { path = "crates/ndo4git-core", version = "0.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
