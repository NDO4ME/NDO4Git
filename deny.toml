# cargo-deny configuration: `cargo deny check`
[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# rsa / crypto-bigint appear in Cargo.lock only as optional deps of ssh-key
# features that are not enabled (verify: `cargo tree -i rsa` prints nothing).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
